name: "Copilot Setup Steps"

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/copilot-setup-steps.yml
  pull_request:
    paths:
      - .github/workflows/copilot-setup-steps.yml

jobs:
  copilot-setup-steps:
    runs-on: windows-2022
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Download Blender (portable)
        shell: pwsh
        run: |
          $version = "4.1.2"  # ajustar según necesidad
          $url = "https://download.blender.org/release/Blender$($version.Split('.')[0]).$($version.Split('.')[1])/blender-$version-windows-x64.zip"
          $out = "$env:RUNNER_TEMP\\blender.zip"
          Invoke-WebRequest -Uri $url -OutFile $out
          Expand-Archive -Path $out -DestinationPath "C:\\blender" -Force

      - name: Add Blender to PATH
        shell: pwsh
        run: |
          $blenderBin = "C:\\blender\\blender-$($version)\\"
          Write-Output "::add-path::$blenderBin"
          setx PATH "$( $env:PATH );$blenderBin" /M

      - name: Verify Blender
        shell: pwsh
        run: |
          C:\\blender\\blender-$version\\blender.exe --version

      - name: Install Python deps for generation scripts
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install numpy Pillow
